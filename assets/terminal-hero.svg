<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="nghqqa 的 GitHub 个人资料终端图:whoami、skills.txt 与项目清单">
  <title>ngh@github:~/profile</title>
  <defs>
    <filter id="win-shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <clipPath id="win-clip">
      <rect x="40" y="30" width="800" height="460" rx="12"/>
    </clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="4" y2="2" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- terminal window -->
  <g filter="url(#win-shadow)">
    <rect x="40" y="30" width="800" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#win-clip)">
    <rect x="40" y="30" width="800" height="34" fill="#161b22"/>
    <line x1="40" y1="64.5" x2="840" y2="64.5" stroke="#30363d" stroke-width="1"/>

    <!-- traffic lights -->
    <circle cx="64" cy="47" r="6.5" fill="#ff5f56"/>
    <circle cx="86" cy="47" r="6.5" fill="#ffbd2e"/>
    <circle cx="108" cy="47" r="6.5" fill="#27c93f"/>

    <text x="440" y="51.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="12.5" fill="#8b949e">ngh@github: ~/profile</text>

    <!-- scanline texture -->
    <rect x="40" y="30" width="800" height="460" fill="url(#scanlines)"/>
  </g>

  <!-- terminal content -->
  <g font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14">

    <!-- whoami -->
    <text x="72" y="100"><tspan fill="#7ee787">ngh@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~/profile</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <text x="94" y="126"><tspan fill="#8b949e">→ </tspan><tspan fill="#e6edf3">逆光海 · 本地优先学习工具 · 多 Agent 工程</tspan></text>

    <text x="72" y="154" fill="#8b949e">$</text>

    <!-- skills -->
    <text x="72" y="186"><tspan fill="#7ee787">ngh@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~/profile</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">cat skills.txt</tspan></text>
    <text x="94" y="212" fill="#4d9fff">typescript</text>
    <text x="203" y="212" fill="#61dafb">react</text>
    <text x="270" y="212" fill="#9feaf9">electron</text>
    <text x="362" y="212" fill="#ffd43b">python</text>
    <text x="438" y="212" fill="#2dd4bf">fastapi</text>
    <text x="522" y="212" fill="#a78bfa">vite</text>
    <text x="94" y="238" fill="#13b9fd">dart</text>
    <text x="170" y="238" fill="#a3e635">vitest</text>
    <text x="271" y="238" fill="#5fd068">playwright</text>
    <text x="372" y="238" fill="#ff6b4a">git</text>

    <text x="72" y="266" fill="#8b949e">$</text>

    <!-- projects -->
    <text x="72" y="298"><tspan fill="#7ee787">ngh@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~/profile</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">ls projects/</tspan></text>
    <text x="72" y="326" fill="#f0883e" font-weight="bold">context-vault/</text>
    <text x="226" y="326" fill="#8b949e">AI 编程会话的本地资产库 · 快照 / 迁移 / Token 账本</text>
    <text x="72" y="354" fill="#f0883e" font-weight="bold">zpocket/</text>
    <text x="226" y="354" fill="#8b949e">ZCode 安卓伴侣客户端 · 手机审批与产物保存</text>
    <text x="72" y="382" fill="#f0883e" font-weight="bold">MergePilot/</text>
    <text x="226" y="382" fill="#8b949e">自托管多 Agent PR 审查工作台 · GitHub 只读接入 · Beta</text>
    <text x="72" y="410" fill="#f0883e" font-weight="bold">tizhou/</text>
    <text x="226" y="410" fill="#8b949e">题舟 · 本地优先考试学习工作台(OCR / 题库 / 模考) ★10</text>

    <text x="72" y="440" fill="#8b949e">$</text>

    <!-- idle prompt with blinking cursor -->
    <text x="72" y="468"><tspan fill="#7ee787">ngh@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~/profile</tspan><tspan fill="#8b949e">$ </tspan></text>
    <rect x="257" y="455" width="8.4" height="17" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
