<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="nghqqa 的 GitHub 个人资料终端图:whoami、skills.txt 与项目清单">
  <title>nghqqa@github:~/profile</title>
  <defs>
